name: SEO research

# Jednorazovy hlubkovy vytah ze Search Console za celou dostupnou historii.
# Spousti se rucne; bezny tydenni sber dela workflow SEO monitor.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Zacatek obdobi (RRRR-MM-DD). Search Console drzi 16 mesicu."
        required: false
        default: "2026-05-01"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Hlubkovy vytah
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_RESEARCH_START: ${{ inputs.start_date }}
        run: node scripts/gsc-research.mjs

      - name: Commit dat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsc
          if git diff --staged --quiet; then
            echo "Zadna nova data."
            exit 0
          fi
          git commit -m "SEO research: hlubkovy vytah $(date -u +%Y-%m-%d)"
          git push
